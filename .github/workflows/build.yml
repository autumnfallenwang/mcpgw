name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize back-to-back main pushes, so an in-flight arch-infra bump isn't cancelled mid-push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/autumnfallenwang/mcpgw:latest
            ghcr.io/autumnfallenwang/mcpgw:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in arch-infra
        env:
          GH_TOKEN: ${{ secrets.ARCH_INFRA_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ARCH_INFRA_TOKEN not set. Skipping arch-infra bump."
            exit 0
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/autumnfallenwang/arch-infra.git" /tmp/arch-infra
          cd /tmp/arch-infra

          if [ ! -f apps/mcpgw.yaml ]; then
            echo "::warning::apps/mcpgw.yaml not present in arch-infra. Skipping bump."
            exit 0
          fi

          # yq v4 is preinstalled on ubuntu-latest.
          yq -i '(.spec.source.helm.parameters[] | select(.name == "image.tag") | .value) = strenv(SHA)' apps/mcpgw.yaml

          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"

          if git diff --quiet apps/mcpgw.yaml; then
            echo "No change: arch-infra apps/mcpgw.yaml already at $SHA."
            exit 0
          fi

          git add apps/mcpgw.yaml
          git commit -m "mcpgw: bump image to $SHA"
          git push

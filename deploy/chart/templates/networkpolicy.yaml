{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcpgw-egress
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcpgw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "mcpgw.searxngSelectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.searxng.port }} }
    {{- if .Values.codeRunner.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "mcpgw.codeRunnerSelectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.codeRunner.port }} }
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $np.blockedRanges | nindent 14 }}
      ports:
        {{- range $np.fetchPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcpgw.searxngSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mcpgw.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.searxng.port }} }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $np.blockedRanges | nindent 14 }}
      ports:
        {{- range $np.searchPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
data:
  settings.yml: |
{{ .Files.Get "files/settings.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
    {{- include "mcpgw.searxngSelectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mcpgw.searxngSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcpgw.searxngSelectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the settings change.
        checksum/settings: {{ .Files.Get "files/settings.yml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
      containers:
        - name: searxng
          image: "{{ .Values.searxng.image.repository }}:{{ .Values.searxng.image.tag }}"
          imagePullPolicy: {{ .Values.searxng.image.pullPolicy }}
          # A random key per pod, so no Secret: nothing signed with it outlives the pod, since the
          # limiter and the image proxy are both off.
          command:
            - sh
            - -c
            - export SEARXNG_SECRET="$(head -c 24 /dev/urandom | base64)"; exec /usr/local/searxng/entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.searxng.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.searxng.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mcpgw.searxngSelectorLabels" . | nindent 4 }}

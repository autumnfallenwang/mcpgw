apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpgw.fullname" . }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
    {{- include "mcpgw.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcpgw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcpgw.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcpgw
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.codeRunner.enabled }}
            - name: CODE_RUNNER_URL
              value: "http://code-runner.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.codeRunner.port }}"
            - name: CODE_RUN_TIMEOUT_MS
              value: {{ .Values.codeRunner.timeoutMs | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; tsx keeps its compile cache in /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

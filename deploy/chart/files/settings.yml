# SearXNG settings, used by the cluster's ConfigMap and by local dev. Only mcpgw calls this instance.
use_default_settings:
  engines:
    # Few engines, to keep upstream traffic low and the home IP from being refused. Google isn't
    # here: it refused every query from this IP in the M3 trial, and only added errors to the logs.
    # Brave's general search isn't either: it was nearly always rate-limited. See dev/benchmark/ before changing this.
    keep_only:
      - yahoo
      - duckduckgo
      - bing
      - wikipedia
      - github
      - stackoverflow
      - arxiv
      - bing news
      - brave.news
      # brave.news won't load without it. It's turned off below.
      - brave

general:
  instance_name: mcpgw
  debug: false

search:
  safe_search: 0
  # JSON must be turned on explicitly; it's the only format mcpgw reads.
  formats:
    - json

server:
  # Replaced at boot by SEARXNG_SECRET, a random value the pod generates: nothing signed with it
  # outlives the pod, since the limiter and the image proxy are both off.
  secret_key: "set-by-SEARXNG_SECRET-at-boot"
  limiter: false
  public_instance: false
  image_proxy: false

# keep_only leaves each engine's default on/off state, and Bing is off by default.
engines:
  - name: yahoo
    disabled: false
  # A backup. It returns the most off-topic results and ignores site:, so at this weight it fills in
  # when the others have too little, rather than leading.
  - name: bing
    disabled: false
    weight: 0.2
  - name: bing news
    disabled: false
  # Scored by a judge model, alone and with Bing News: dev/benchmark/news.mjs. If it's rate-limited, Bing News carries on.
  - name: brave.news
    disabled: false
  - name: brave
    disabled: true

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
